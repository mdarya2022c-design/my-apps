name: Deploy App to Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build

      - name: Call Cloud API
        run: |
          curl -X POST https://your-cloud-api.com/deploy \
            -H "Authorization: Bearer ${{ secrets.CLOUD_API_KEY }}" \
            -d '{ "app": "my-app", "version": "1.0" }'

      - name: Post Deployment
        run: echo "App deployed successfully!"
